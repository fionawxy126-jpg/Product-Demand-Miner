<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Demand Miner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Product Demand Miner</h1>
        <p class="subtitle">从专业社媒挖掘产品对应的用户需求痛点，自动生成产品市场调研报告</p>

        <form id="minerForm">
            <!-- 产品名称及基础信息 -->
            <div class="form-row">
                <div class="form-group" style="flex:0.4">
                    <label for="product_name">产品名称</label>
                    <input type="text" id="product_name" name="product_name"
                           placeholder="例如: AD" required>
                </div>
                <div class="form-group">
                    <label for="product_scope">产品涉及领域 <span class="hint">（产品涉及的相关领域和方向）</span></label>
                    <input type="text" id="product_scope" name="product_scope"
                           placeholder="例如: Vibe coding 研发协助">
                </div>
            </div>
            <div class="form-group">
                <label for="product_desc">产品简介 <span class="hint">（一句话描述产品是什么）</span></label>
                <input type="text" id="product_desc" name="product_desc"
                       placeholder="例如: 全流程完善Vibe Coding代码生成和研发协助工具，支持从需求分析、代码生成、提示词记录、项目分析的全流程研发协助">
            </div>

            <!-- 搜索关键词 -->
            <div class="form-group">
                <label for="keywords">爬取关键词 <span class="hint">（输入需要收集的痛点数据在相关领域的关键词）</span></label>
                <input type="text" id="keywords" name="keywords"
                       placeholder="例如: Claude Code, Cursor AI, Vibe coding assistant" required>
            </div>

            <!-- 数据来源平台 -->
            <div class="form-group">
                <label>数据来源平台</label>
                <div class="platform-row">
                    <label class="checkbox-item">
                        <input type="checkbox" name="platforms" value="reddit" checked>
                        Reddit
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="platforms" value="hackernews">
                        Hacker News
                    </label>
                </div>
                <div class="other-platform">
                    <input type="text" id="other_platforms" name="other_platforms"
                           placeholder="其他平台（如 LinkedIn、Twitter）— 暂不支持自动爬取，仅记录在报告中">
                </div>
            </div>

            <!-- 板块选择（动态加载） -->
            <div class="form-group" id="subredditSection">
                <label>
                    搜索板块
                    <button type="button" id="suggestBtn" class="btn-sm">推荐板块</button>
                </label>
                <p class="hint" id="subredditHint">输入关键词后点击"推荐板块"，帮你自动推荐，或手动添加</p>
                <div class="checkbox-grid" id="subredditGrid"></div>
                <div class="add-subreddit">
                    <input type="text" id="customSubreddit" placeholder="手动添加板块（如 Cursor）">
                    <button type="button" id="addSubBtn" class="btn-sm">添加</button>
                </div>
            </div>

            <!-- 时间范围 -->
            <div class="form-group">
                <label>时间范围</label>
                <div class="time-presets">
                    <label class="radio-item">
                        <input type="radio" name="time_preset" value="3m">
                        近 3 个月
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="time_preset" value="6m">
                        近 6 个月
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="time_preset" value="1y" checked>
                        近 1 年
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="time_preset" value="custom">
                        自定义
                    </label>
                </div>
                <div class="form-row hidden" id="customDateRow">
                    <div class="form-group">
                        <input type="date" id="time_start" name="time_start">
                    </div>
                    <div class="form-group">
                        <input type="date" id="time_end" name="time_end">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn">开始挖掘</button>
            <span id="spinner" class="spinner hidden"></span>
        </form>

        <!-- 进度 -->
        <div id="progress" class="progress-area hidden">
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p id="progressText"></p>
        </div>

        <!-- AI 复核 -->
        <div id="review" class="review-area hidden">
            <div class="review-head">
                <div>
                    <h2>AI 复核草稿</h2>
                    <p id="reviewSummary"></p>
                </div>
                <button type="button" id="exportBtn" class="btn">确认导出报告</button>
            </div>
            <div id="normalizationStats" class="review-stats"></div>

            <div class="review-section">
                <h3>痛点复核</h3>
                <div id="painReviewList" class="review-list"></div>
            </div>

            <div class="review-section">
                <h3>期待功能复核</h3>
                <div id="featureReviewList" class="review-list"></div>
            </div>
        </div>

        <!-- 结果 -->
        <div id="result" class="result-area hidden">
            <h2>挖掘完成</h2>
            <div id="resultStats"></div>
            <div class="result-actions">
                <a id="downloadMd" class="btn" href="#">下载 Markdown</a>
                <a id="downloadDocx" class="btn btn-secondary" href="#">下载 Word 文档</a>
                <a id="downloadCsv" class="btn btn-secondary" href="#">下载 CSV</a>
            </div>
        </div>
    </div>

    <script>
    const form = document.getElementById('minerForm');
    const progressDiv = document.getElementById('progress');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const subredditGrid = document.getElementById('subredditGrid');
    const reviewDiv = document.getElementById('review');
    const exportBtn = document.getElementById('exportBtn');
    let currentTaskId = null;
    let currentReview = null;

    // ---- 时间预设 ----
    const timePresets = document.querySelectorAll('input[name="time_preset"]');
    const customDateRow = document.getElementById('customDateRow');

    timePresets.forEach(radio => {
        radio.addEventListener('change', () => {
            customDateRow.classList.toggle('hidden', radio.value !== 'custom');
        });
    });

    function getDates() {
        const preset = document.querySelector('input[name="time_preset"]:checked').value;
        const now = new Date();
        let start, end = '', filter = 'year';

        if (preset === '3m') {
            start = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate());
            filter = 'year';
        } else if (preset === '6m') {
            start = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate());
            filter = 'year';
        } else if (preset === '1y') {
            start = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
            filter = 'year';
        } else {
            start = document.getElementById('time_start').value
                ? new Date(document.getElementById('time_start').value)
                : new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
            end = document.getElementById('time_end').value || '';
            filter = 'all';
        }

        const fmt = d => d.toISOString().split('T')[0];
        return {
            time_start: fmt(start),
            time_end: end,
            time_filter: filter,
        };
    }

    // ---- 板块推荐 ----
    document.getElementById('suggestBtn').addEventListener('click', async () => {
        const kw = document.getElementById('keywords').value;
        if (!kw.trim()) { alert('请先输入关键词'); return; }

        const btn = document.getElementById('suggestBtn');
        btn.textContent = '搜索中...';
        btn.disabled = true;

        try {
            const resp = await fetch('/suggest_subreddits', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({keywords: kw}),
            });
            const data = await resp.json();

            subredditGrid.innerHTML = '';
            if (data.subreddits && data.subreddits.length > 0) {
                document.getElementById('subredditHint').textContent =
                    `根据关键词找到 ${data.subreddits.length} 个相关板块，请勾选需要的：`;
                data.subreddits.forEach(sub => {
                    const label = document.createElement('label');
                    label.className = 'checkbox-item';
                    label.innerHTML = `<input type="checkbox" name="subreddits" value="${sub.name}" checked>
                        <span>r/${sub.name} <span class="sub-subs">(${(sub.subscribers || 0).toLocaleString()} 成员)</span></span>`;
                    subredditGrid.appendChild(label);
                });
            } else {
                document.getElementById('subredditHint').textContent = '未找到相关板块，请手动添加';
            }
        } catch (err) {
            alert('推荐失败: ' + err.message);
        } finally {
            btn.textContent = '推荐板块';
            btn.disabled = false;
        }
    });

    // ---- 手动添加板块 ----
    document.getElementById('addSubBtn').addEventListener('click', () => {
        const input = document.getElementById('customSubreddit');
        const name = input.value.trim().replace(/^r\//, '');
        if (!name) return;

        // 检查是否已存在
        const existing = subredditGrid.querySelectorAll('input[name="subreddits"]');
        for (const el of existing) {
            if (el.value.toLowerCase() === name.toLowerCase()) {
                el.checked = true;
                input.value = '';
                return;
            }
        }

        const label = document.createElement('label');
        label.className = 'checkbox-item';
        label.innerHTML = `<input type="checkbox" name="subreddits" value="${name}" checked>
            <span>r/${name}</span>`;
        subredditGrid.appendChild(label);
        input.value = '';
    });

    // ---- 提交 ----
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const platforms = Array.from(
            form.querySelectorAll('input[name="platforms"]:checked')
        ).map(el => el.value);

        if (platforms.length === 0) {
            alert('请至少选择一个数据来源平台');
            return;
        }

        const checked = form.querySelectorAll('input[name="subreddits"]:checked');
        const subreddits = Array.from(checked).map(el => el.value);
        if (platforms.includes('reddit') && subreddits.length === 0) {
            alert('请至少选择一个 Reddit 板块');
            return;
        }

        const dates = getDates();

        const payload = {
            product_name: document.getElementById('product_name').value,
            product_desc: document.getElementById('product_desc').value,
            product_scope: document.getElementById('product_scope').value,
            keywords: document.getElementById('keywords').value,
            subreddits: subreddits,
            time_start: dates.time_start,
            time_end: dates.time_end,
            time_filter: dates.time_filter,
            platforms: platforms,
            other_platforms: document.getElementById('other_platforms').value,
        };

        submitBtn.disabled = true;
        submitBtn.textContent = '正在挖掘';
        document.getElementById('spinner').classList.remove('hidden');
        progressDiv.classList.remove('hidden');
        resultDiv.classList.add('hidden');
        reviewDiv.classList.add('hidden');
        currentTaskId = null;
        currentReview = null;
        progressBar.style.width = '0%';

        try {
            const resp = await fetch('/run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            });
            const data = await resp.json();
            if (data.error) {
                progressText.textContent = '错误: ' + data.error;
                submitBtn.disabled = false;
                submitBtn.textContent = '开始挖掘';
                document.getElementById('spinner').classList.add('hidden');
                return;
            }
            currentTaskId = data.task_id;
            pollStatus(data.task_id);
        } catch (err) {
            progressText.textContent = '请求失败: ' + err.message;
            submitBtn.disabled = false;
            submitBtn.textContent = '开始挖掘';
            document.getElementById('spinner').classList.add('hidden');
        }
    });

    function pollStatus(taskId) {
        const interval = setInterval(async () => {
            try {
                const resp = await fetch('/status/' + taskId);
                const data = await resp.json();

                if (data.progress) {
                    progressText.textContent = data.progress;
                    progressBar.style.width = '60%';
                }

                if (data.status === 'done') {
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    progressText.textContent = '报告已生成。';

                    const r = data.result;
                    showDownloads(r);

                    resultDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '开始挖掘';
                    document.getElementById('spinner').classList.add('hidden');
                    resultDiv.scrollIntoView({behavior: 'smooth'});
                } else if (data.status === 'review_ready') {
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    progressText.textContent = 'AI 复核完成，请检查修改后导出报告。';

                    currentReview = data.result.review;
                    renderReview(data.result);

                    reviewDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '重新挖掘';
                    document.getElementById('spinner').classList.add('hidden');
                    reviewDiv.scrollIntoView({behavior: 'smooth'});
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    progressText.textContent = '错误: ' + data.progress;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '开始挖掘';
                    document.getElementById('spinner').classList.add('hidden');
                }
            } catch (err) {
                clearInterval(interval);
                progressText.textContent = '轮询失败: ' + err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = '开始挖掘';
                document.getElementById('spinner').classList.add('hidden');
            }
        }, 2000);
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[char]));
    }

    function renderReview(result) {
        const review = result.review;
        const stats = result.normalization || {};
        const sourceCounts = stats.source_counts || {};
        const sourceText = Object.keys(sourceCounts).length
            ? Object.entries(sourceCounts).map(([name, count]) => `${name}: ${count}`).join(' / ')
            : '暂无来源统计';

        document.getElementById('reviewSummary').innerHTML =
            `共保留 <strong>${result.total_posts}</strong> 条帖子，识别出 <strong>${result.pain_count}</strong> 类痛点，<strong>${result.feature_count}</strong> 类期待功能。`;

        document.getElementById('normalizationStats').innerHTML =
            `<span>原始 ${stats.raw_count || 0}</span>
             <span>保留 ${stats.kept_count || 0}</span>
             <span>去重 ${stats.duplicate_count || 0}</span>
             <span>时间过滤 ${stats.date_filtered_count || 0}</span>
             <span>${escapeHtml(sourceText)}</span>`;

        document.getElementById('painReviewList').innerHTML =
            review.pain_points.length
                ? review.pain_points.map(renderPainItem).join('')
                : '<p class="empty-state">未识别到明确痛点，可调整关键词或扩大时间范围。</p>';

        document.getElementById('featureReviewList').innerHTML =
            review.features.length
                ? review.features.map(renderFeatureItem).join('')
                : '<p class="empty-state">未识别到明确期待功能，可在最终报告中手动补充。</p>';
    }

    function renderPainItem(item, index) {
        return `<section class="review-item" data-section="pain_points" data-key="${escapeHtml(item.key)}">
            <div class="review-item-top">
                <label class="review-keep">
                    <input type="checkbox" data-field="keep" ${item.keep ? 'checked' : ''}>
                    保留
                </label>
                <span>${index + 1}. ${escapeHtml(item.count)} 条证据 · 最高 ${escapeHtml(item.top_score)} 赞 · ${escapeHtml(item.total_comments)} 评论</span>
            </div>
            <label>痛点标题</label>
            <input type="text" data-field="label" value="${escapeHtml(item.label)}">
            <label>核心问题</label>
            <textarea data-field="core_issue" rows="2">${escapeHtml(item.core_issue)}</textarea>
            <label>人工备注</label>
            <textarea data-field="manual_note" rows="2" placeholder="补充你的判断、优先级或需要进入报告的洞察">${escapeHtml(item.manual_note)}</textarea>
            ${renderReviewNotes(item.review_notes)}
            ${renderEvidence(item.evidence)}
        </section>`;
    }

    function renderFeatureItem(item, index) {
        return `<section class="review-item" data-section="features" data-key="${escapeHtml(item.key)}">
            <div class="review-item-top">
                <label class="review-keep">
                    <input type="checkbox" data-field="keep" ${item.keep ? 'checked' : ''}>
                    保留
                </label>
                <span>${index + 1}. ${escapeHtml(item.count)} 条证据</span>
            </div>
            <label>功能标题</label>
            <input type="text" data-field="label" value="${escapeHtml(item.label)}">
            <label>人工备注</label>
            <textarea data-field="manual_note" rows="2" placeholder="补充你的判断、适用场景或产品建议">${escapeHtml(item.manual_note)}</textarea>
            ${renderReviewNotes(item.review_notes)}
            ${renderEvidence(item.evidence)}
        </section>`;
    }

    function renderReviewNotes(notes = []) {
        return `<div class="review-notes">${notes.map(note => `<span>${escapeHtml(note)}</span>`).join('')}</div>`;
    }

    function renderEvidence(posts = []) {
        if (!posts.length) return '';
        return `<div class="evidence-list">
            ${posts.map(post => `<a href="${escapeHtml(post.url)}" target="_blank" rel="noopener">
                <strong>${escapeHtml(post.title)}</strong>
                <span>${escapeHtml(post.source)} · ${escapeHtml(post.subreddit)} · ${escapeHtml(post.score)} 赞 · ${escapeHtml(post.num_comments)} 评论 · ${escapeHtml(post.created_utc)}</span>
            </a>`).join('')}
        </div>`;
    }

    function collectReviewData() {
        return {
            ...currentReview,
            pain_points: collectReviewSection('pain_points'),
            features: collectReviewSection('features'),
        };
    }

    function collectReviewSection(section) {
        return Array.from(reviewDiv.querySelectorAll(`[data-section="${section}"]`)).map(item => {
            const data = {
                key: item.dataset.key,
                keep: item.querySelector('[data-field="keep"]').checked,
                label: item.querySelector('[data-field="label"]').value,
                manual_note: item.querySelector('[data-field="manual_note"]').value,
            };
            const coreIssue = item.querySelector('[data-field="core_issue"]');
            if (coreIssue) data.core_issue = coreIssue.value;
            return data;
        });
    }

    exportBtn.addEventListener('click', async () => {
        if (!currentTaskId || !currentReview) {
            alert('请先完成一次挖掘和复核');
            return;
        }

        exportBtn.disabled = true;
        exportBtn.textContent = '正在导出';
        progressText.textContent = '正在根据复核结果生成报告...';
        resultDiv.classList.add('hidden');

        try {
            const resp = await fetch('/export/' + currentTaskId, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({review: collectReviewData()}),
            });
            const data = await resp.json();
            if (data.error) {
                progressText.textContent = '导出失败: ' + data.error;
                return;
            }

            showDownloads(data.result);
            resultDiv.classList.remove('hidden');
            progressText.textContent = '报告已生成。';
            resultDiv.scrollIntoView({behavior: 'smooth'});
        } catch (err) {
            progressText.textContent = '导出失败: ' + err.message;
        } finally {
            exportBtn.disabled = false;
            exportBtn.textContent = '确认导出报告';
        }
    });

    function showDownloads(r) {
        document.getElementById('resultStats').innerHTML =
            `<p>最终报告包含 <strong>${r.total_posts}</strong> 条帖子，保留 <strong>${r.pain_count}</strong> 类痛点，<strong>${r.feature_count}</strong> 类期待功能。</p>`;

        const mdFile = r.md_path.split('/').pop();
        const csvFile = r.csv_path.split('/').pop();
        const docxFile = r.docx_path.split('/').pop();
        document.getElementById('downloadMd').href = '/download/' + mdFile;
        document.getElementById('downloadCsv').href = '/download/' + csvFile;
        document.getElementById('downloadDocx').href = '/download/' + docxFile;
    }
    </script>
</body>
</html>
